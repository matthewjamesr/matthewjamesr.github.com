<div style="box-sizing:border-box;max-width:100%;">
<div id="briefmap" style="width:100%;height:420px;border-radius:12px;overflow:hidden;border:1px solid var(--hatch-widget-border);"></div>
<div style="font-size:12px;color:var(--hatch-widget-muted);margin-top:6px;">Map data © OpenStreetMap contributors. Polygons mark approximate / announced areas.</div>
</div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var map = L.map('briefmap');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 12, attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  var colors = {"strike": "#d23b2e", "threat": "#e8862e", "closure": "#7b4fd0", "base": "#2e6fd2", "facility": "#1f9e63", "city": "#555555"};
  var pts = [];
  var items = [{"name": "New York (UN General Assembly)", "lat": 40.74967, "lon": -73.96917, "kind": "city", "note": "High-level debate opens Sept 22; Trump addresses the Assembly Tuesday; Pezeshkian Wednesday; possible Trump-Pezeshkian meeting.", "polygon": null}, {"name": "Geneva, Switzerland", "lat": 46.20833, "lon": 6.14275, "kind": "city", "note": "Interactive dialogue on the fact-finding mission's Iran report held today; EU and UK statements urged accountability and an end to executions.", "polygon": null}, {"name": "Strait of Hormuz", "lat": 26.5, "lon": 56.25, "kind": "closure", "note": "Two tanker attacks reported by UKMTO on Monday (inbound vessel struck by unknown projectile, 2 crew injured; outbound LPG tanker hit by debris). No attribution.", "polygon": [[26.0, 56.0], [27.0, 56.0], [27.0, 56.6], [26.0, 56.6]]}, {"name": "Marib, Yemen", "lat": 15.45051, "lon": 45.33276, "kind": "threat", "note": "Heavy fighting Monday as Houthi fighters pushed for strategic highlands to cut off the Red Sea coast from Saudi-backed forces.", "polygon": null}];
  items.forEach(function(it){
    var c = colors[it.kind] || '#333333';
    if (it.polygon) {
      var poly = L.polygon(it.polygon, {color: c, weight: 2, fillOpacity: 0.25}).addTo(map);
      poly.bindPopup('<b>'+it.name+'</b><br/>'+it.note);
      it.polygon.forEach(function(p){ pts.push(p); });
    }
    var m = L.circleMarker([it.lat, it.lon], {
      radius: 8, color: '#ffffff', weight: 2, fillColor: c, fillOpacity: 1
    }).addTo(map);
    m.bindPopup('<b>'+it.name+'</b><br/>'+it.note);
    pts.push([it.lat, it.lon]);
  });
  if (pts.length) map.fitBounds(pts, {padding: [30, 30]});
})();
</script>
